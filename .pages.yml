media:
  input: public/images
  output: /images

content:
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    view:
      fields: [title]
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Content
        type: rich-text

  - name: navigation
    label: Navigation
    type: file
    path: content/navigation.json
    fields:
      - name: links
        label: Menu links
        type: object
        list: true
        fields:
          - name: label
            label: Link text
            type: string
            required: true
          - name: href
            label: URL
            type: string
            required: true
